[project]
name = "ai-service"
version = "0.1.0"
description = "Private Arabic invoice extraction service"
readme = "README.md"
authors = [
    { name = "Op_Bshaar", email = "bashaarabdalla5@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1,<2",
    "langchain-google-genai>=4.3.7",
    "langgraph>=1.2.12",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transcriber_id"
