[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "arabic-invoice-transcriber"
version = "0.1.0"
description = "Local review and Excel export for handwritten Arabic invoices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1,<2",
    "pillow>=11,<13",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.workspace]
members = [
    "ai-service",
]
