[project]
name = "arabic-invoice-transcriber"
version = "0.1.0"
description = "Local review and Excel export for handwritten Arabic invoices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-service",
]

[dependency-groups]
dev = [
    "nbformat>=5.10,<6",
    "openpyxl>=3.1,<4",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
ai-service = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["ai-service/tests"]
addopts = "-ra"

[tool.uv.workspace]
members = [
    "ai-service",
]
